version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: catan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: catanpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: catan_server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:catanpassword@postgres:5432/catan
      JWT_SECRET: change_this_secret_in_production
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: catan_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_SERVER_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001
    depends_on:
      - server

volumes:
  postgres_data:
